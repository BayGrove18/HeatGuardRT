name: Host State-Machine Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  control-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run control tests
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -IUSER \
            USER/control.c tests/control_test.c -o /tmp/control_test
          /tmp/control_test
